---
lab:
  name: adshares-lab
  region: eu-west-3
  domain: lab.local
  domain_admin: john.john
  domain_admin_display: John John
  expires_hours: 24

defaults:
  windows_instance_type: t3.large
  linux_instance_type: t3.large
  windows_disk_gb: 50
  linux_disk_gb: 50
  windows_version: "2022"
  ubuntu_release: "22.04"

hosts:
  - name: dc01
    os: windows
    role: dc
    instance_type: t3.medium
    private_ip: 10.0.1.10
    

  - name: srv-win01
    os: windows
    role: member
    instance_type: t3.medium

  - name: vpn01
    os: linux
    role: standalone
    instance_type: t3.nano
    disk_gb: 8
    source_dest_check: false
    expose_ports:
      - { port: 1194, proto: udp }
    modules:
      - vpn
