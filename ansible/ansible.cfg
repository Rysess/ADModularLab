[defaults]
# No default inventory: ./lab passes -i labs/<name>/inventory, which carries that
# lab's dynamic inventory, secrets (group_vars) and per-host vars (host_vars).
roles_path           = roles:modules
host_key_checking    = False
retry_files_enabled  = False
# Releases barrier waiters when a host goes unreachable (callback_plugins/).
callback_plugins     = callback_plugins
callbacks_enabled    = lab_barrier
gathering            = smart
interpreter_python   = auto_silent
# The default of 5 serialises anything larger than a toy lab.
forks                = 20
timeout              = 60

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
