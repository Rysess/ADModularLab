---
ansible_connection: winrm
ansible_user: Administrator
# NTLM with message encryption: nothing (password or payload) crosses the
# internet in clear, although the listener is HTTP. Basic is disabled on hosts.
ansible_winrm_transport: ntlm
ansible_winrm_message_encryption: always
ansible_winrm_server_cert_validation: ignore
ansible_winrm_scheme: http
ansible_port: 5985
ansible_winrm_read_timeout_sec: 90
ansible_winrm_operation_timeout_sec: 80

# ansible_password is per host (inventory host_vars written by ./lab from the
# Terraform outputs): a group_vars template keyed on
# inventory_hostname resolves to the wrong host under delegate_to.
