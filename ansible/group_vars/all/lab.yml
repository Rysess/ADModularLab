---
# Domain -> the DC serving it. Every domain-bearing host declares the domain it
# serves or joins, so forest roots and child domains key the same way.
dc_hosts_by_domain: >-
  {{ dict((groups['role_dc'] | default([]) + groups['role_child_dc'] | default([]))
          | map('extract', hostvars, 'domain_name')
          | zip(groups['role_dc'] | default([]) + groups['role_child_dc'] | default([]))) }}

# A host with no domain of its own (a standalone vpn box, say) falls back to
# the only controller; declare 'domain' on it to choose in a multi-domain lab.
domain_dc_host: >-
  {{ dc_hosts_by_domain.get(domain_name | default(''),
       groups['role_dc'] | default([]) | first | default('')) }}

dc_private_ip: "{{ hostvars[domain_dc_host].private_ip if domain_dc_host else '' }}"

elastic_private_ip: "{{ groups['mod_edr_server'] | default([]) | map('extract', hostvars, 'private_ip') | first | default('') }}"

domain_netbios: "{{ domain_name.split('.')[0] | upper }}"

child_dc_user: svc_childdc
