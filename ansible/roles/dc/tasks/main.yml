---
# Renamed by site.yml first (a promoted DC cannot be renamed).
# microsoft.ad.domain installs features, promotes when needed, owns the reboot.
- name: Promote to domain controller
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    safe_mode_password: "{{ dsrm_password }}"
    install_dns: true
    forest_mode: "{{ dc_forest_mode | default(omit, true) }}"
    domain_mode: "{{ dc_domain_mode | default(omit, true) }}"
    reboot: true

- name: Resolve through itself, then the VPC resolver
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers: "{{ dc_dns_servers }}"

- name: Wait for Active Directory Web Services
  ansible.windows.win_service:
    name: ADWS
    state: started
  register: dc_adws
  until: dc_adws is succeeded
  retries: 10
  delay: 30

- name: Create the lab accounts
  ansible.builtin.include_tasks:
    file: lab_accounts.yml
