---
# domain_name is the domain this host serves; its parent is that minus the first label.
domain_child_domain: "{{ domain_name }}"
domain_child_parent_domain: "{{ domain_name.split('.')[1:] | join('.') }}"
domain_child_parent_host: "{{ dc_hosts_by_domain[domain_child_parent_domain] }}"

# UPN, not NETBIOS: Install-ADDSDomain resolves the credential domain over DNS.
domain_child_admin_user: "{{ child_dc_user }}@{{ domain_child_parent_domain }}"
domain_child_admin_password: "{{ child_dc_password }}"

domain_child_parent_wait_timeout: 1800
domain_child_locator_retries: 20
domain_child_locator_delay: 15
domain_child_retries: 3
domain_child_delay: 60
