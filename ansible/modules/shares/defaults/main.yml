---
shares_dc_host: "{{ domain_dc_host }}"

shares_root: 'C:\Shares'
shares_netbios: "{{ domain_netbios }}"

shares_ad_retries: 5
shares_ad_delay: 10

shares_ad_groups:
  - IT-Admins
  - Finance-Team
  - Backup-Admins
  - DevOps
  - Server-Admins
  - Management
  - HR
  - Helpdesk
  - Security-Team
  - Auditors

# Auditors is nested into the sensitive groups.
shares_ad_group_members:
  - group: Finance-Team
    members: [LabUser1, Auditors]
  - group: IT-Admins
    members: [LabUser2, Auditors]
  - group: Backup-Admins
    members: [LabUser3, Auditors]
  - group: DevOps
    members: [LabUser4, Auditors]
  - group: Server-Admins
    members: [LabUser9, Auditors]
  - group: Management
    members: [LabUser5]
  - group: HR
    members: [LabUser6]
  - group: Helpdesk
    members: [LabUser7]
  - group: Security-Team
    members: [LabUser8]
  - group: Auditors
    members: [LabUser10]

shares_definitions:
  - { name: Finance, grp: Finance-Team }
  - { name: IT, grp: IT-Admins }
  - { name: Backups, grp: Backup-Admins }
  - { name: DevOps, grp: DevOps }
  - { name: Public, grp: Domain Users }

# Prune negatives and depth for share crawlers.
shares_extra_dirs:
  - 'Public\a\b\c\d'
  - 'Public\node_modules'
  - 'Public\.git\objects\ab'

