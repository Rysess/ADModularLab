---
# Every key below may be written without its shares_ prefix in lab.yml:
#   modules: { shares: { shares: {...}, loot: [...], bots: [...] } }
# expand.py normalises them; see README.

shares_dc_host: "{{ domain_dc_host }}"
shares_root: 'C:\Shares'
shares_netbios: "{{ domain_netbios }}"
shares_bot_dir: 'C:\ProgramData\LabBots'
shares_ad_retries: 5
shares_ad_delay: 10

# name -> {read, write, full, abe, description, path}, or just the reader(s).
# A trailing $ hides the share. Principals missing from AD are created as global
# groups on the domain controller. write = Modify, full = Full Control.
shares_shares:
  Public:
    description: Company-wide drop box
    read: [Domain Users]
    write: [Domain Users]
  Finance:
    read: [Finance-Team, Management]
  HR:
    read: [HR]
    abe: true
  IT:
    description: IT tooling and scripts
    read: [IT-Admins, Helpdesk]
    write: [IT-Admins, Helpdesk]
  DevOps:
    read: [DevOps]
  Backups$:
    description: Backup staging
    read: [Backup-Admins]

# Files that hold the REAL password of a lab account. kind is one of:
#   script   PowerShell with a PSCredential        batch     net use ... /user:
#   config   web.config connection string           env       .env file
#   unattend unattend.xml (base64 "obfuscated")      note      a handover note
#   gpp      Groups.xml with a cpassword, in SYSVOL (MS14-025; no share/file)
#   file     your own {content}
# The password is looked up from identity (or the lab defaults) unless given.
shares_loot:
  - { kind: gpp, user: svc_deploy }
  - { kind: script, share: DevOps, file: pipelines/release.ps1, user: svc_sql }
  - { kind: unattend, share: Backups$, file: images/unattend.xml, user: svc_backup }

# Simulated users. Each runs as a domain account from a scheduled task:
#   script  runs <share>\<file> as <user> every <every> minutes
#   browse  opens every UNC path listed in <share>\<file> (NTLM to wherever it points)
# Files a bot reads are written once and never overwritten, so a change you make
# survives a re-run. The bot's account is granted read on its share.
shares_bots:
  - { kind: script, user: svc_backup, share: IT, file: scripts/maintenance.ps1, every: 5 }
  - { kind: browse, user: svc_monitor, share: Public, file: monitoring/servers.txt, every: 2 }

# Realistic filler documents per share, so loot has to be looked for.
shares_noise: 12

# Synthetic secret-looking decoys (fake keys, tokens, dumps) for scanners.
shares_decoys: true

# default leaves Windows alone; disabled makes this host an NTLM relay target.
shares_smb_signing: default

# Decoys: everything below is fabricated. The first path segment is the share's
# directory; a decoy whose share is not defined is skipped.
shares_decoy_files:
  - dest: 'Finance\Passwords_2025.xlsx'
    content: "fake xlsx - keep-filename-contains-yellow\n"
  - dest: 'Finance\DA_credentials.txt'
    content: "password = Sup3rS3cret!\n"
