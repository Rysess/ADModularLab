---
- name: Fail early when no domain controller is in the inventory
  ansible.builtin.assert:
    that: groups['role_dc'] | default([]) | length > 0
    fail_msg: >-
      The shares module creates AD groups on the domain controller, but no host
      with role=dc is in the inventory. Check lab.yml.
    quiet: true

- name: Create AD security groups (on the DC)
  microsoft.ad.group:
    name: "{{ item }}"
    scope: global
    category: security
    state: present
  loop: "{{ shares_ad_groups }}"
  delegate_to: "{{ shares_dc_host }}"
  register: shares_groups
  until: shares_groups is succeeded
  retries: "{{ shares_ad_retries }}"
  delay: "{{ shares_ad_delay }}"

- name: Populate AD group memberships (users + nested Auditors)
  microsoft.ad.group:
    name: "{{ item.group }}"
    scope: global
    members:
      add: "{{ item.members }}"
    state: present
  loop: "{{ shares_ad_group_members }}"
  loop_control:
    label: "{{ item.group }}"
  delegate_to: "{{ shares_dc_host }}"
  register: shares_members
  until: shares_members is succeeded
  retries: "{{ shares_ad_retries }}"
  delay: "{{ shares_ad_delay }}"

- name: Create share root dirs
  ansible.windows.win_file:
    path: "{{ shares_root }}\\{{ item.name }}"
    state: directory
  loop: "{{ shares_definitions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create extra dirs (prune-negatives + depth test)
  ansible.windows.win_file:
    path: "{{ shares_root }}\\{{ item }}"
    state: directory
  loop: "{{ shares_extra_dirs }}"

- name: Write synthetic artifacts
  ansible.windows.win_copy:
    dest: "{{ shares_root }}\\{{ item.dest }}"
    content: "{{ item.content }}"
  loop: "{{ shares_files }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure Administrators + SYSTEM keep Full Control (pre-lockdown)
  ansible.windows.win_acl:
    path: "{{ shares_root }}\\{{ item.0.name }}"
    user: "{{ item.1 }}"
    rights: "FullControl"
    type: allow
    state: present
    inherit: "ContainerInherit, ObjectInherit"
    propagation: "None"
  loop: "{{ shares_definitions | product(['BUILTIN\\Administrators', 'NT AUTHORITY\\SYSTEM']) | list }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"

- name: Disable NTFS inheritance and drop inherited ACEs
  ansible.windows.win_acl_inheritance:
    path: "{{ shares_root }}\\{{ item.name }}"
    state: absent
    reorganize: false
  loop: "{{ shares_definitions }}"
  loop_control:
    label: "{{ item.name }}"

- name: Grant ONLY the mapped AD group ReadAndExecute (NTFS)
  ansible.windows.win_acl:
    path: "{{ shares_root }}\\{{ item.name }}"
    user: "{{ shares_netbios }}\\{{ item.grp }}"
    rights: "ReadAndExecute"
    type: allow
    state: present
    inherit: "ContainerInherit, ObjectInherit"
    propagation: "None"
  loop: "{{ shares_definitions }}"
  loop_control:
    label: "{{ item.name }} <- {{ item.grp }}"

- name: Publish shares (read = mapped group only)
  ansible.windows.win_share:
    name: "{{ item.name }}"
    path: "{{ shares_root }}\\{{ item.name }}"
    state: present
    full: "BUILTIN\\Administrators"
    read: "{{ shares_netbios }}\\{{ item.grp }}"
    list: true
  loop: "{{ shares_definitions }}"
  loop_control:
    label: "{{ item.name }} <- {{ item.grp }}"
