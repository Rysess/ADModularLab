---
vpn_port: 1194
vpn_proto: udp
vpn_cipher: AES-256-GCM

# One profile is generated per name here. vpn_client_name seeds the default so a
# lab that sets neither still gets a single client1.ovpn.
vpn_client_name: client1
vpn_clients: ["{{ vpn_client_name }}"]

vpn_easyrsa_dir: /etc/openvpn/easy-rsa
vpn_server_dir: /etc/openvpn/server
vpn_service: openvpn-server@server

# EC purely for speed: the lab's VPN is an access path, not a secret store.
vpn_easyrsa_algo: ec
vpn_easyrsa_curve: prime256v1
vpn_ca_cn: lab-ovpn-ca

# Where the generated profiles land on the operator's machine: one
# <client>.ovpn per name in vpn_clients.
vpn_profile_dir: "{{ playbook_dir }}"
