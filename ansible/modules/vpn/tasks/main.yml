---
- name: Wait for cloud-init
  ansible.builtin.wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 600

- name: Install OpenVPN, easy-rsa and iptables persistence
  ansible.builtin.apt:
    name: [openvpn, easy-rsa, iptables, iptables-persistent, openssl]
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-openvpn.conf
    sysctl_set: true
    reload: true

- name: Create the easy-rsa CA directory
  ansible.builtin.command:
    cmd: make-cadir {{ vpn_easyrsa_dir }}
    creates: "{{ vpn_easyrsa_dir }}/easyrsa"

- name: Build the PKI (init / ca / server / client)
  ansible.builtin.command:
    cmd: "{{ item.cmd }}"
    chdir: "{{ vpn_easyrsa_dir }}"
    creates: "{{ vpn_easyrsa_dir }}/{{ item.creates }}"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: "{{ vpn_easyrsa_algo }}"
    EASYRSA_CURVE: "{{ vpn_easyrsa_curve }}"
    EASYRSA_REQ_CN: "{{ vpn_ca_cn }}"
  loop:
    - { cmd: "./easyrsa init-pki", creates: "pki" }
    - { cmd: "./easyrsa build-ca nopass", creates: "pki/ca.crt" }
    - { cmd: "./easyrsa build-server-full server nopass", creates: "pki/issued/server.crt" }
    - { cmd: "./easyrsa build-client-full {{ vpn_client_name }} nopass", creates: "pki/issued/{{ vpn_client_name }}.crt" }
  loop_control:
    label: "{{ item.creates }}"

- name: Create the server directory
  ansible.builtin.file:
    path: "{{ vpn_server_dir }}"
    state: directory
    mode: "0700"

- name: Generate the tls-crypt key
  ansible.builtin.command:
    cmd: openvpn --genkey secret {{ vpn_server_dir }}/tls-crypt.key
    creates: "{{ vpn_server_dir }}/tls-crypt.key"

- name: Stage the server key material
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: "{{ vpn_easyrsa_dir }}/pki/ca.crt", dest: "{{ vpn_server_dir }}/ca.crt" }
    - { src: "{{ vpn_easyrsa_dir }}/pki/issued/server.crt", dest: "{{ vpn_server_dir }}/server.crt" }
    - { src: "{{ vpn_easyrsa_dir }}/pki/private/server.key", dest: "{{ vpn_server_dir }}/server.key" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart openvpn

- name: Write server.conf
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ vpn_server_dir }}/server.conf"
    mode: "0600"
  notify: Restart openvpn

# No NAT: the route table sends the client CIDR here, so lab hosts see the
# client's own address and auth events attribute to it.
- name: Forward traffic to and from the VPN subnet
  ansible.builtin.iptables:
    chain: FORWARD
    source: "{{ item.source | default(omit) }}"
    destination: "{{ item.destination | default(omit) }}"
    jump: ACCEPT
    state: present
    action: append
  loop:
    - { source: "{{ vpn_client_cidr }}" }
    - { destination: "{{ vpn_client_cidr }}" }
  loop_control:
    label: "{{ item.source | default(item.destination) }}"
  notify: Persist iptables rules

- name: Enable and start OpenVPN
  ansible.builtin.systemd_service:
    name: "{{ vpn_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Read the client PKI material
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ vpn_easyrsa_dir }}/pki/ca.crt"
    - "{{ vpn_easyrsa_dir }}/pki/issued/{{ vpn_client_name }}.crt"
    - "{{ vpn_easyrsa_dir }}/pki/private/{{ vpn_client_name }}.key"
    - "{{ vpn_server_dir }}/tls-crypt.key"
  loop_control:
    label: "{{ item | basename }}"
  register: vpn_pki
  no_log: true

# Rendered every run so the profile follows the public IP across stop/start.
- name: Render the client profile
  ansible.builtin.template:
    src: client.ovpn.j2
    dest: "/home/ubuntu/{{ vpn_client_name }}.ovpn"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  vars:
    vpn_endpoint: "{{ ansible_host }}"
    vpn_ca_cert: "{{ vpn_pki.results[0].content | b64decode }}"
    vpn_client_cert: "{{ vpn_pki.results[1].content | b64decode }}"
    vpn_client_key: "{{ vpn_pki.results[2].content | b64decode }}"
    vpn_tls_crypt: "{{ vpn_pki.results[3].content | b64decode }}"
  no_log: true

- name: Fetch the client profile to the operator
  ansible.builtin.fetch:
    src: "/home/ubuntu/{{ vpn_client_name }}.ovpn"
    dest: "{{ vpn_profile_dest }}"
    flat: true
