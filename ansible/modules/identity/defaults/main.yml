---
identity_domain: "{{ domain_name }}"
identity_domain_dn: "DC={{ identity_domain.split('.') | join(',DC=') }}"

identity_ad_retries: 5
identity_ad_delay: 10

# 'always' re-applies an edited password; on_create leaves it.
identity_update_password: on_create

# key = sAMAccountName; value = display name or a mapping. Membership is set
# only via identity_groups. See README.
identity_users: {}

# name -> member list, or a mapping (members, scope, category, ou).
identity_groups:
  Auditors: [LabUser10]
  Finance-Team: [LabUser1, Auditors]
  IT-Admins: [LabUser2, Auditors]
  Backup-Admins: [LabUser3, Auditors]
  DevOps: [LabUser4, Auditors]
  Server-Admins: [LabUser9, Auditors]
  Management: [LabUser5]
  HR: [LabUser6]
  Helpdesk: [LabUser7]
  Security-Team: [LabUser8]

# Only OUs nothing else references; a user/group 'ou' creates its path.
identity_ous: []
