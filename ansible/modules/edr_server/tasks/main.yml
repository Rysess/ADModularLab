---
- name: Guard - edr_server is Linux only
  ansible.builtin.assert:
    that: ansible_system == 'Linux'
    fail_msg: "edr_server runs on Linux only (Elastic stack via Docker). Check lab.yml."
    quiet: true

- name: Wait for cloud-init
  ansible.builtin.wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 600

- name: Install the Docker repository prerequisites
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
    state: present
    update_cache: true

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker, the compose plugin, nginx and jq
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - jq
      - nginx
    state: present
    update_cache: true

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the ubuntu user talk to Docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

# update: false — the password substituted into the tracked .env below dirties
# the tree and a pull would refuse. Remove the directory to move the pin.
- name: Clone the elastic-container stack definition
  ansible.builtin.git:
    repo: "{{ edr_server_repo }}"
    dest: "{{ edr_server_dir }}"
    version: "{{ edr_server_repo_version }}"
    update: false

- name: Check for the stack environment file
  ansible.builtin.stat:
    path: "{{ edr_server_dir }}/.env"
  register: edr_server_env

# Older checkouts shipped only .env.spec.
- name: Seed .env from .env.spec
  ansible.builtin.copy:
    src: "{{ edr_server_dir }}/.env.spec"
    dest: "{{ edr_server_dir }}/.env"
    remote_src: true
    mode: "0600"
  when: not edr_server_env.stat.exists

- name: Restrict the stack environment file
  ansible.builtin.file:
    path: "{{ edr_server_dir }}/.env"
    mode: "0600"

- name: Set the Elastic password in .env
  ansible.builtin.replace:
    path: "{{ edr_server_dir }}/.env"
    regexp: changeme
    replace: "{{ elastic_password }}"
  no_log: true

- name: Check whether the stack is already up
  ansible.builtin.command:
    cmd: docker ps --quiet --filter name={{ edr_server_probe_container }} --filter status=running
  register: edr_server_running
  changed_when: false

- name: Start the Elastic stack
  ansible.builtin.command:
    cmd: ./elastic-container.sh start
    chdir: "{{ edr_server_dir }}"
  when: edr_server_running.stdout | trim | length == 0
  changed_when: true

- name: Wait for Elasticsearch
  ansible.builtin.uri:
    url: https://localhost:9200
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
    status_code: 200
  register: edr_server_es
  until: edr_server_es.status == 200
  retries: "{{ edr_server_wait_retries }}"
  delay: "{{ edr_server_wait_delay }}"

- name: Record the Elasticsearch version
  ansible.builtin.set_fact:
    elastic_version: "{{ edr_server_es.json.version.number }}"

- name: Create the agent download directory
  ansible.builtin.file:
    path: "{{ edr_server_agent_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

# Served locally so the agent version matches the running stack.
- name: Publish the matching Windows Elastic Agent
  ansible.builtin.get_url:
    url: >-
      https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_version }}-windows-x86_64.zip
    dest: "{{ edr_server_agent_dir }}/elastic-agent-win.zip"
    mode: "0644"

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Wait for Kibana
  ansible.builtin.uri:
    url: https://localhost:5601/api/status
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: edr_server_kibana
  until: edr_server_kibana.status == 200
  retries: "{{ edr_server_wait_retries }}"
  delay: "{{ edr_server_wait_delay }}"

# Advisory: a lab without detection rules is still usable.
- name: Activate the trial licence
  ansible.builtin.uri:
    url: https://localhost:9200/_license/start_trial?acknowledge=true
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 201, 403]
  register: edr_server_trial
  failed_when: false
  changed_when: edr_server_trial.status in [200, 201]

- name: Enable the Windows and Active Directory detection rules
  ansible.builtin.uri:
    url: https://localhost:5601/api/detection_engine/rules/_bulk_action
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 120
    headers:
      kbn-xsrf: "true"
      Content-Type: application/json
    body_format: json
    body:
      query: "{{ edr_server_rule_query }}"
      action: enable
    status_code: [200, 201]
  register: edr_server_rules
  failed_when: false
  # Returns 200 whether or not anything changed.
  changed_when: false

- name: Create the read-only monitor role
  ansible.builtin.uri:
    url: "https://localhost:9200/_security/role/{{ edr_server_monitor_role }}"
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body:
      cluster: [monitor]
      indices: []
    status_code: [200, 201]

- name: Create the monitor user
  ansible.builtin.uri:
    url: "https://localhost:9200/_security/user/{{ edr_server_monitor_user }}"
    method: POST
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      Content-Type: application/json
    body_format: json
    body:
      password: "{{ monitor_password }}"
      roles: ["{{ edr_server_monitor_role }}"]
      full_name: Agent Version Checker
    status_code: [200, 201]
  no_log: true
