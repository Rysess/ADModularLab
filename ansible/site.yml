---
- name: Wait for hosts to accept connections
  hosts: all
  gather_facts: false
  strategy: free
  tags: always
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 900

# Members are renamed during the join; everything else up front, because a DC
# cannot be renamed once promoted.
- name: Set Windows computer names
  hosts: windows:!role_member
  gather_facts: false
  strategy: free
  tags: [base, prepare, dc]
  tasks:
    - name: Set computer name
      ansible.windows.win_hostname:
        name: "{{ inventory_hostname }}"
      register: rename

    - name: Reboot to apply the computer name
      ansible.windows.win_reboot:
        reboot_timeout: 900
        post_reboot_delay: 15
      when: rename.reboot_required

- name: Promote domain controllers
  hosts: role_dc
  gather_facts: false
  tags: [base, dc]
  roles:
    - dc

- name: Promote child domain controllers
  hosts: role_child_dc
  gather_facts: false
  tags: [base, child_dc]
  roles:
    - domain_child

- name: Join domain members
  hosts: role_member
  gather_facts: false
  strategy: free
  tags: [base, member]
  roles:
    - domain_member

# identity creates principals that other hosts' modules reference, so it runs
# in its own play: a play boundary is a barrier, the module loop below is not.
- name: Apply directory modules
  hosts: role_dc:role_child_dc
  gather_facts: false
  tags: [modules]
  tasks:
    - name: Include staged module role
      ansible.builtin.include_role:
        name: "{{ mod }}"
        apply:
          tags: [modules]
      loop: "{{ modules | default([], true) | select('in', staged_modules) | list }}"
      loop_control:
        loop_var: mod
        label: "{{ mod }}"
      tags: [modules]

- name: Apply modules (Linux)
  hosts: linux
  gather_facts: true
  become: true
  strategy: free
  tags: [modules]
  tasks:
    - name: Include module role
      ansible.builtin.include_role:
        name: "{{ mod }}"
        apply:
          tags: [modules]
      loop: "{{ modules | default([], true) | reject('in', staged_modules) | list }}"
      loop_control:
        loop_var: mod
        label: "{{ mod }}"
      tags: [modules]

- name: Apply modules (Windows)
  hosts: windows
  gather_facts: false
  strategy: free
  tags: [modules]
  tasks:
    - name: Include module role
      ansible.builtin.include_role:
        name: "{{ mod }}"
        apply:
          tags: [modules]
      loop: "{{ modules | default([], true) | reject('in', staged_modules) | list }}"
      loop_control:
        loop_var: mod
        label: "{{ mod }}"
      tags: [modules]
