---
# The whole lab in one play. strategy: free lets every host move through its
# own pipeline (pipeline/windows.yml, pipeline/linux.yml) at its own pace;
# hosts only wait for each other at explicit barriers (pipeline/wait.yml).
#
# ./lab clears the barrier markers (labs/<lab>/.lab/run) before every run.
- name: Build the lab
  hosts: all
  gather_facts: false
  strategy: free
  vars:
    lab_modules: "{{ modules | default([], true) }}"
    lab_role: "{{ group_names | select('match', '^role_') | map('regex_replace', '^role_', '')
                  | first | default('standalone') }}"
  tasks:
    - name: Wait for the host to accept connections
      ansible.builtin.wait_for_connection:
        timeout: 900
      tags: always

    - name: Build a Windows host
      ansible.builtin.include_tasks: pipeline/windows.yml
      when: "'windows' in group_names"
      tags: always

    - name: Build a Linux host
      ansible.builtin.include_tasks: pipeline/linux.yml
      when: "'linux' in group_names"
      tags: always
