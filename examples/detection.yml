# Detection engineering: weak AD, a file and SQL server, the Elastic stack with
# agents everywhere, reachable over the VPN. About $0.31/hour.

lab:
  expires: 72h
  vpn: true

hosts:
  dc01:
    role: dc
    modules:
      identity:
      gmsa:
      vulns:
        kerberoast: true
        asreproast: true
        dcsync: true
        dcsync_principals: [LabUser5]
      edr_agent:

  srv01:
    modules:
      shares:
      sql_server:
      edr_agent:
      session:
        user: svc_monitor               # a live logon to find in LSASS

  elastic01:
    modules: [edr_server]               # Linux, t3.large, 100 GB: from its module
