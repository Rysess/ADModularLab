# The smallest useful Active Directory lab: one domain controller and nothing
# else. About $0.05/hour.
#
#   ./lab new mini --from minimal && ./lab up mini
#
# Access is over WinRM and RDP from the deploying machine's public IP. Add
# `vpn: true` under lab to reach it over a VPN instead.

lab:
  expires: 8h

hosts:
  dc01:
    role: dc                  # lab.local, admin lab.admin, t3.medium
