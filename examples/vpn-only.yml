---
# Smallest useful lab: a VPN box and nothing else. About $0.01/hour.
# Useful for checking AWS credentials and the VPN path first.
#
#   LAB_FILE=examples/vpn-only.yml ./run.sh

lab:
  name: vpn-only-lab
  region: eu-west-3
  domain_admin: john.john
  expires_hours: 24

defaults:
  windows_instance_type: t3.large
  linux_instance_type: t3.nano
  windows_disk_gb: 50
  linux_disk_gb: 8

hosts:
  - name: vpn01
    os: linux
    role: standalone
    disk_gb: 8
    source_dest_check: false
    expose_ports:
      - { port: 1194, proto: udp }
    modules:
      - vpn
