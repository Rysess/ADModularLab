# The AD attack surface: every misconfiguration the vulns module can toggle, with
# a member server as the delegation target. About $0.08/hour.

lab:
  expires: 24h

hosts:
  dc01:
    role: dc
    modules:
      vulns:
        kerberoast: true                # SPNs on weak-password service accounts
        asreproast: true                # pre-auth disabled on LabUser3 and LabUser7
        dcsync: true
        dcsync_principals: [LabUser5]
        unconstrained_delegation: true
        unconstrained_delegation_computers: [srv01]
        rbcd: true
        rbcd_grants:
          - { computer: srv01, allowed: [LabUser1] }

  srv01: {}                             # the delegation target; a member by default
