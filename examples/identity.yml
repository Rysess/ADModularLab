# Users, groups, OUs and logon rights: identity (who exists) and logon (who may
# sign in where). About $0.08/hour.
#
#   ./lab new idlab --from identity && ./lab up idlab

lab:
  admin: john.john
  admin_display: John John
  expires: 24h

hosts:
  dc01:
    role: dc
    ip: 10
    modules:
      identity:
        # Generated staff on top of what is declared below. 0 turns it off.
        generate: 40
        admin_accounts: 2               # adm.<user> Domain Admins for 2 IT staff
        weak_passwords: 5               # sprayable (Summer2025!, Welcome1!, ...)
        password_in_description: 2
        password_policy: { min_length: 7, lockout_threshold: 0 }
        machine_account_quota: 10

        # Users are keyed by sAMAccountName (the login). The value is a display
        # name, or a mapping for more.
        users:
          alice:
            display: Alice Martin
            ou: Tier0/Admins
            groups: [Tier0-Admins, Domain Admins]
            sensitive: true             # "account is sensitive and cannot be delegated"
          bob: Bob Reyes
          svc_app:
            display: App Service
            ou: Servers
            password: Summer2025!       # defaults to a strong per-account password
            spn: HTTP/app.lab.local     # kerberoastable
          old.contractor:
            display: Old Contractor
            asrep: true                 # no Kerberos pre-auth: AS-REP roastable
            enabled: false
        groups:
          # Short form: name -> members. A member is a user or another group.
          Server-Admins: [alice]
          Helpdesk: [bob, Server-Admins]
          Tier0-Admins:
            ou: Tier0/Admins
            scope: universal
            description: Forest administrators

  srv01:
    ip: 40
    ports: [3389]                       # RDP from the operator's IP
    modules:
      logon:
        admins: [Server-Admins]         # local Administrators (additive)
        rdp: [Helpdesk]                 # local Remote Desktop Users (additive)
        interactive: [Server-Admins]    # replaces the right; drops Users
        deny_network: [Tier0-Admins]    # keep tier 0 off this tier 1 host
