# Two forests with a forest trust, a child domain, members in two domains, and
# LAPS. About $0.27/hour.

lab:
  expires: 24h

hosts:
  dc01:
    role: dc
    domain: lab.local
    ip: 10
    modules:
      trust:
        partners: [{ name: partner.local }]   # forest, bidirectional by default

  dc02:
    role: dc
    domain: partner.local
    ip: 20
    modules:
      trust:
        partners: [{ name: lab.local }]

  dc-child:
    role: child_dc
    domain: child.lab.local
    ip: 30

  srv01:
    domain: lab.local                   # several forests: say which one
    ip: 40
    modules:
      laps:
        read_principals: [Domain Users] # the over-permissive delegation

  srv-child:
    domain: child.lab.local
    ip: 50
