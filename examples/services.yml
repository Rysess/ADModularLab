# File shares, SQL Server, gMSA and Defender on one member server.
# About $0.12/hour.

lab:
  expires: 24h
  vpn: true

hosts:
  dc01:
    role: dc
    modules:
      identity:
      gmsa:
        count: 6

  srv01:
    modules:
      shares:
        smb_signing: disabled           # makes srv01 an NTLM relay target
      sql_server:
      defender:
        enabled: false
